name: Release

on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  check:
    name: Check release
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
      - name: Extract version
        id: version
        run: |
          version=$(grep -oP '(?<=VERSION = ")[^"]+' lib/clickhouse_native/version.rb)
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - name: Check if release already exists
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" &>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  source-gem:
    name: Build & push source gem
    needs: check
    if: needs.check.outputs.exists == 'false'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - name: Build source gem
        run: bundle exec rake build
      - name: Push to RubyGems
        env:
          GEM_HOST_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
        run: gem push pkg/*.gem

  native-gems:
    name: Build & push native gem (${{ matrix.platform }})
    needs: check
    if: needs.check.outputs.exists == 'false'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        platform:
          - x86_64-linux-gnu
          - aarch64-linux-gnu
          - x86_64-darwin
          - arm64-darwin
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - name: Cross-compile ${{ matrix.platform }}
        run: bundle exec rake gem:cross:${{ matrix.platform }}
      - name: Push to RubyGems
        env:
          GEM_HOST_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
        run: gem push pkg/*-${{ matrix.platform }}.gem

  github-release:
    name: Create GitHub release
    needs: [check, source-gem, native-gems]
    if: needs.check.outputs.exists == 'false'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Create release with auto-generated notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${{ needs.check.outputs.tag }}" \
            --title "${{ needs.check.outputs.tag }}" \
            --target "$GITHUB_SHA" \
            --generate-notes
